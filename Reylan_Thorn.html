<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c1514">
  <meta name="description" content="A field-ready AD&amp;D 2e game tracker for Reylan Thorn.">
  <title>Reylan Thorn — Game Tracker</title>
  <style>
    :root{color-scheme:light;--bg:#f1eadc;--ink:#29332f;--muted:#68736f;--panel:#fffdf7;--panel2:#f4efe4;--line:rgba(53,76,69,.17);--teal:#3f7168;--gold:#976a27;--red:#a34f45;--green:#56805b;--shadow:0 16px 36px rgba(65,52,31,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#e4d7bf 0,transparent 34%),linear-gradient(135deg,rgba(91,70,39,.025) 25%,transparent 25%) 0 0/18px 18px,var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
    button,select,input,textarea{font:inherit}button,select{color:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:30px 0 64px}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:8px 0 24px;border-bottom:1px solid rgba(209,162,83,.55)}
    .eyebrow,.label{margin:0 0 7px;color:var(--gold);font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:0;font:500 clamp(2.8rem,7vw,5.2rem)/.9 Georgia,serif}.tagline{margin:12px 0 0;color:var(--muted)}.seal{width:76px;height:76px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px rgba(151,106,39,.28);color:var(--gold);font:700 1.5rem Georgia,serif}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:14px 0}.persist{display:inline-flex;align-items:center;gap:7px;margin-right:auto;color:var(--muted);font-size:.76rem}.persist-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(86,128,91,.12)}.button{min-height:40px;border:1px solid rgba(151,106,39,.42);border-radius:9px;background:#faf6ed;padding:8px 13px;cursor:pointer;font-weight:700}.button:hover{background:#eee5d5}.button.primary{background:var(--gold);border-color:var(--gold);color:#fffdf7}.button.danger{border-color:rgba(163,79,69,.38);color:var(--red)}.button.small{min-height:32px;padding:5px 9px;font-size:.8rem}.button:focus-visible,.icon-button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(151,106,39,.38);outline-offset:2px}
    .combat{display:grid;grid-template-columns:1.45fr .9fr .9fr;gap:14px;margin-bottom:14px}.card,.panel{background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.hp-card{padding:18px 20px}.hp-line{display:flex;align-items:center;justify-content:space-between;gap:16px}.hp-value{display:flex;align-items:baseline;gap:8px}.hp-value strong,.big-stat{font:500 3.5rem Georgia,serif}.hp-value span{color:var(--muted)}.hp-actions{display:flex;gap:8px}.icon-button{width:43px;height:43px;border:1px solid rgba(151,106,39,.42);border-radius:50%;background:#fffdf8;color:var(--ink);font-size:1.5rem;cursor:pointer}.hp-form{display:flex;gap:8px;margin-top:12px}.hp-form input{width:82px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;color:var(--ink);padding:8px}.stat-card{padding:18px 20px;display:flex;flex-direction:column}.stat-card .big-stat{margin:auto 0 0}.detail{color:var(--muted);font-size:.77rem}
    .dashboard{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}.stack{display:grid;gap:14px}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-head h2{margin:0;font:500 1.45rem Georgia,serif}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:.78rem}.panel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.save-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.save{min-height:96px;display:flex;flex-direction:column;justify-content:space-between;border-radius:10px;background:var(--panel2);padding:11px}.save span{color:var(--muted);font-size:.72rem}.save strong{font:500 2rem Georgia,serif}
    .resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.resource{border-radius:11px;background:var(--panel2);padding:13px}.resource-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.resource-title strong{font-family:Georgia,serif;font-weight:500}.charges{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.charge-pips{display:flex;gap:5px;flex-wrap:wrap}.pip{width:18px;height:18px;border:1px solid var(--teal);border-radius:50%;background:transparent;cursor:pointer;padding:0}.pip.full{background:var(--gold);border-color:var(--gold)}.sunrise{margin-top:12px;width:100%}
    .list{display:grid;gap:8px}.track-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 11px;border-radius:9px;background:var(--panel2)}.track-row.potion-row{grid-template-columns:1fr auto auto}.track-row.used{opacity:.55}.track-row button{min-width:74px}.potion-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin:9px 0 12px}.potion-form input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fffdf8;color:var(--ink);padding:9px 11px}.empty-message{margin:0;padding:11px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:.82rem}.subtle{color:var(--muted);font-size:.78rem}.cantrips{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:#faf6ed;padding:7px 10px;font-size:.82rem}.chip.cantrip{border-color:rgba(151,106,39,.36);color:#80591f}.prepared-level{margin-top:15px}.level-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.level-head h3{margin:0;color:var(--gold);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase}.level-head span{color:var(--muted);font-size:.75rem}.prepared-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.spell-slot{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px 9px}.spell-slot.cast{opacity:.5;text-decoration:line-through}.spell-slot.empty{border-style:dashed;color:var(--muted)}
    .ring-slots{display:grid;gap:9px}.ring-slot{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center}.ring-number{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(151,106,39,.38);border-radius:50%;color:var(--gold);font:700 .8rem Georgia,serif}.ring-slot select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fffdf8;padding:9px}.ring-slot.expended select{opacity:.5;text-decoration:line-through}
    .spellbook{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.spellbook[hidden]{display:none}.spellbook-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.spellbook-group{border-radius:10px;background:#f8f3e9;padding:12px}.spellbook-group h3{margin:0 0 8px;color:var(--gold);font:700 .78rem Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.spell-choice{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;font-size:.82rem}.quantity{display:grid;grid-template-columns:28px 24px 28px;align-items:center;text-align:center}.qty-button{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fffdf8;color:var(--ink);cursor:pointer;font-weight:800}.qty-button:disabled{cursor:not-allowed;opacity:.35}.spell-count{font-weight:800;color:var(--gold)}.notice{margin:13px 0 0;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(151,106,39,.07);color:var(--muted);font-size:.8rem}.field-notes{margin-top:14px}.field-notes textarea{display:block;width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#fffdf8;color:var(--ink);padding:14px;line-height:1.55}.field-notes textarea::placeholder{color:#929b97}
    .spell-dialog{width:min(1000px,calc(100% - 28px));max-height:88vh;margin:auto;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 28px 80px rgba(28,35,31,.3)}.spell-dialog::backdrop{background:rgba(30,37,34,.58);backdrop-filter:blur(2px)}.dialog-shell{padding:22px}.dialog-head{position:sticky;top:-22px;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:-22px -22px 16px;padding:22px;background:rgba(255,253,247,.97);border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font:500 1.75rem Georgia,serif}.dialog-head p{margin:4px 0 0;color:var(--muted);font-size:.82rem}.dialog-close{flex:0 0 auto}.spell-tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:14px}.spell-tools input,.spell-tools select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffdf8;color:var(--ink);padding:10px 12px}.detail-spells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.spell-card{border:1px solid var(--line);border-radius:11px;background:#f8f3e9;padding:14px}.spell-card[hidden]{display:none}.spell-card h3{margin:0;font:500 1.15rem Georgia,serif}.spell-tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 11px}.spell-tag{border-radius:999px;background:#efe5d2;padding:4px 7px;color:#76531f;font-size:.7rem;font-weight:700}.spell-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin:0 0 11px}.spell-meta div{min-width:0}.spell-meta dt{color:var(--muted);font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.spell-meta dd{margin:1px 0 0;font-size:.8rem}.spell-effect,.spell-quick{margin:0;font-size:.83rem}.spell-quick{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--teal);font-weight:700}.no-spell-results{grid-column:1/-1;margin:0;padding:26px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:16px;margin-top:20px;padding:14px 2px;color:var(--muted);font-size:.72rem;border-top:1px solid var(--line)}
    @media(max-width:850px){.combat,.dashboard{grid-template-columns:1fr}.save-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){.detail-spells{grid-template-columns:1fr}.spell-tools{grid-template-columns:1fr}.panel-head{align-items:flex-start}.panel-actions{justify-content:flex-start}}
    @media(max-width:560px){.shell{width:min(100% - 20px,1180px);padding-top:18px}.seal{width:56px;height:56px;font-size:1rem}.hero h1{font-size:2.75rem}.top-actions{justify-content:stretch;flex-wrap:wrap}.persist{width:100%;margin-bottom:2px}.top-actions .button{flex:1}.resource-grid,.prepared-list,.spellbook-grid{grid-template-columns:1fr}.save-grid{grid-template-columns:repeat(2,1fr)}.ring-slot{grid-template-columns:28px 1fr}.ring-slot .button{grid-column:2}.track-row.potion-row{grid-template-columns:1fr auto}.track-row.potion-row .remove-potion{grid-column:2}.potion-form{grid-template-columns:1fr}.hp-line{align-items:flex-end}.hp-form{flex-wrap:wrap}.dialog-shell{padding:16px}.dialog-head{top:-16px;margin:-16px -16px 14px;padding:16px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (()=>{
      "use strict";
      const SPELLS={
        "Cantrip":["Mage Hand","Mending","Light","Detect Magic"],
        "1st":["Comprehend Languages","Feather Fall","Grease","Identify","Magic Missile","Protection from Evil","Read Magic","Shield","Sleep"],
        "2nd":["Detect Invisibility","Invisibility","Knock","Levitate","Mirror Image","Web","Wizard Lock"],
        "3rd":["Clairvoyance","Dispel Magic","Fireball","Fly","Haste","Lightning Bolt","Locate Object","Protection from Normal Missiles","Water Breathing"],
        "4th":["Dimension Door","Evard's Black Tentacles","Ice Storm","Improved Invisibility","Polymorph Self","Stoneskin"]
      };
      const SPELL_DETAILS=[["Cantrip","5e","Mage Hand","Conjuration","1 action","30 ft.","1 minute","V, S","Create a spectral hand that can manipulate an object, open an unlocked door or container, stow or retrieve an item, or pour out a vial. It cannot attack, activate magic items, or carry more than 10 lb.","At will; move or use the hand with an action; it vanishes beyond 30 ft."],["Cantrip","5e","Mending","Transmutation","1 minute","Touch","Instantaneous","V, S, M","Repair one break or tear no larger than 1 foot in any dimension, leaving no trace of the damage. It can physically repair a magic item or construct but cannot restore lost magic.","At will; material component: two lodestones."],["Cantrip","5e","Light","Evocation","1 action","Touch","1 hour","V, M","Make one object no larger than 10 feet shed bright light for 20 feet and dim light for 20 feet more. The color is chosen when cast; an opaque cover blocks it. A hostile holder gets a Dexterity save.","At will; one active Light at a time; firefly or phosphorescent moss."],["Cantrip","DM-approved 5e-style","Detect Magic","Divination","1 action","Self (30-ft. sense)","Concentration, up to 10 minutes","V, S","Sense magic within 30 feet. An action reveals a faint aura around a visible magical creature or object and its school, if any. The sense is blocked by 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt.","At will; DM-approved conversion from the 5e 1st-level spell."],["1st","AD&D 2e","Comprehend Languages","Alteration","1","Touch","5 rounds/level","V, S, M","Understand unfamiliar spoken words or written text while touching the speaker or writing. The spell grants comprehension, not the ability to speak or write the language.","Reylan 7: 35 rounds."],["1st","AD&D 2e","Feather Fall","Alteration","1","10 yd./level","1 round/level","V","Slow the fall of creatures or objects in a 10-foot cube so they land without normal falling damage. The spell affects a limited total weight and ends when the subjects land.","Reylan 7: 70 yd.; 7 rounds."],["1st","AD&D 2e","Grease","Conjuration","1","10 yd.","3 rounds + 1/level","V, S, M","Coat a 10-foot square or one object with slippery grease. Creatures in the area may fall and must check again while moving; held objects may be dropped.","Reylan 7: 10 rounds."],["1st","AD&D 2e","Identify","Divination","1 turn","0","1 round/level","V, S, M","Examine a prepared magical item to learn likely properties. The spell is demanding, requires handling the item, and does not guarantee a complete account of every power or drawback.","Reylan 7: up to 7 rounds of examination."],["1st","AD&D 2e","Magic Missile","Evocation","1","60 yd. + 10 yd./level","Instantaneous","V, S","Launch unerring bolts of magical force at visible targets. Each missile deals 1d4+1 damage; multiple missiles may be divided among targets.","Reylan 7: 4 missiles; range 130 yd."],["1st","AD&D 2e","Protection from Evil","Abjuration","1","Touch","2 rounds/level","V, S, M","Ward the subject against attacks and mental control by evil creatures, including a +2 defensive benefit under the spell's conditions. Bodily contact with a warded summoned creature can end the protection.","Reylan 7: 14 rounds."],["1st","AD&D 2e","Read Magic","Divination","1 round","0","2 rounds/level","V, S, M","Read magical inscriptions, scrolls, and spellbook notation that would otherwise be unintelligible. Reading a scroll does not itself trigger the spell written there.","Reylan 7: 14 rounds."],["1st","AD&D 2e","Shield","Evocation","1","0","5 rounds/level","V, S","Create an invisible frontal barrier that improves Armor Class against attacks from the front and negates Magic Missile from that direction. It does not protect against attacks from behind.","Reylan 7: 35 rounds; also stored in the ring."],["1st","AD&D 2e","Sleep","Enchantment","1","30 yd.","5 rounds/level","V, S, M","Put 2d4 Hit Dice of creatures in a 15-foot-radius area to sleep, affecting the weakest first. Very powerful creatures and many nonliving or supernatural beings are unaffected.","Reylan 7: 35 rounds; no normal saving throw for eligible targets."],["2nd","AD&D 2e","Detect Invisibility","Divination","2","0","5 rounds/level","V, S, M","See invisible creatures and objects along the caster's line of sight, including certain concealed or out-of-phase forms, subject to the spell's limits.","Reylan 7: 35 rounds."],["2nd","AD&D 2e","Invisibility","Illusion","2","Touch","Special","V, S, M","Make a creature and its carried gear invisible. The effect normally ends when the subject attacks; observers may still infer the subject's location from noise or disturbance.","Duration is special; attacking ends it."],["2nd","AD&D 2e","Knock","Alteration","1","60 yd.","Special","V","Open stuck, barred, locked, held, or magically secured doors and containers within the spell's limits. A Wizard Lock is suppressed temporarily rather than removed.","Fast utility for doors, chests, shackles, and similar closures."],["2nd","AD&D 2e","Levitate","Alteration","2","20 yd./level","1 turn/level","V, S, M","Move the subject vertically, usually up to 20 feet per round. The spell provides no direct horizontal movement, though the subject can push or pull against fixed objects.","Reylan 7: 140 yd.; 7 turns."],["2nd","AD&D 2e","Mirror Image","Illusion","1","0","3 rounds/level","V, S","Create 2d4 illusory duplicates that move with the caster. Successful attacks may strike and destroy an image instead of Reylan.","Reylan 7: 21 rounds; 2d4 images."],["2nd","AD&D 2e","Web","Evocation","2","5 yd./level","2 turns/level","V, S, M","Fill anchored space with strong, sticky strands. Creatures save vs. spell at -2 when caught; Strength determines whether and how quickly they can force through. Fire destroys the web and can harm trapped creatures.","Reylan 7: 35 yd.; 14 turns; up to eight 10-foot cubes; also stored in ring."],["2nd","AD&D 2e","Wizard Lock","Alteration","2","Touch","Permanent","V, S","Magically secure a door, chest, or portal. Reylan can pass his own lock freely; Knock or sufficiently powerful magic can bypass or suppress it under the core rules.","Permanent until dispelled or otherwise defeated."],["3rd","AD&D 2e","Clairvoyance","Divination","3","Special","1 round/level","V, S, M","View a distant place known to the caster or an obvious nearby location beyond normal sight. The spell transmits sight, not sound, and may be blocked by magical protections.","Reylan 7: 7 rounds."],["3rd","AD&D 2e","Dispel Magic","Abjuration","3","60 yd.","Instantaneous","V, S","End ongoing spells or suppress magical effects in an area or on a chosen target. Success against another caster's magic depends on the difference in caster levels.","Reylan 7: standard dispel check uses caster level 7."],["3rd","AD&D 2e","Fireball","Evocation","3","10 yd. + 10 yd./level","Instantaneous","V, S, M","Explode a bead of fire into a 20-foot-radius burst. Creatures take 1d6 damage per caster level, with a save for half; the blast conforms to available volume and can ignite combustibles.","Reylan 7: 7d6; range 80 yd."],["3rd","AD&D 2e","Fly","Alteration","3","Touch","1 turn/level + 1d6 turns","V, S, M","Grant controlled flight with good tactical mobility. Ascending is slower and diving is faster than level flight; the uncertain end time makes landing plans important.","Reylan 7: 7 turns + 1d6 turns."],["3rd","AD&D 2e","Haste","Alteration","3","60 yd.","3 rounds + 1/level","V, S, M","Double movement and increase attack rate for creatures in the area. The 2e version ages recipients one year and can require a system shock check, so use deliberately.","Reylan 7: 10 rounds."],["3rd","AD&D 2e","Lightning Bolt","Evocation","3","40 yd. + 10 yd./level","Instantaneous","V, S, M","Fire a stroke of lightning that deals 1d6 damage per caster level, save for half. Choose a long narrow or shorter wide bolt; barriers can cause dangerous rebound under 2e geometry.","Reylan 7: 7d6; range 110 yd."],["3rd","AD&D 2e","Locate Object","Divination","3","20 yd./level","1 round/level","V, S, M","Sense the direction of a familiar object or the nearest object of a described type, subject to range and barriers. The spell gives direction, not a complete path or exact distance.","Reylan 7: 140 yd.; 7 rounds."],["3rd","AD&D 2e","Protection from Normal Missiles","Abjuration","3","Touch","1 turn/level","V, S, M","Protect the subject from nonmagical missiles and similar ordinary projectiles within the spell's limits. Magical missiles, large siege weapons, and spell effects are not normal missiles.","Reylan 7: 7 turns."],["3rd","AD&D 2e","Water Breathing","Alteration","3","Touch","1 hour/level","V, S, M","Allow one or more touched creatures to breathe water normally. The total duration is divided among the recipients; the spell does not grant swimming ability or protection from pressure.","Reylan 7: 7 total hours divided among recipients."],["4th","AD&D 2e","Dimension Door","Alteration","1","0","Instantaneous","V","Instantly transport Reylan, carried gear, and limited additional weight to a precisely visualized destination. A bad destination can cause failure or danger; acting again immediately is restricted.","Reylan 7: transport distance up to 210 yd."],["4th","AD&D 2e","Evard's Black Tentacles","Conjuration","1","30 yd.","1 hour/level","V, S, M","Fill an area with grasping black tentacles that attack creatures within it, restraining and crushing those they catch. The area is dangerous to allies as well as enemies.","Reylan 7: 1d4+7 tentacles; 7 hours."],["4th","AD&D 2e","Ice Storm","Evocation","4","10 yd./level","Instantaneous or special","V, S, M","Choose a damaging hailstorm in a 40-foot-diameter area or a much larger sleet effect that obscures vision, hampers movement, and extinguishes small flames.","Reylan 7: range 70 yd.; hail deals 3d10 with no save."],["4th","AD&D 2e","Improved Invisibility","Illusion","4","Touch","4 rounds + 1/level","V, S","Make the subject invisible even while attacking. Opponents still receive any perception or combat adjustments allowed by the rules, and magical detection can reveal the subject.","Reylan 7: 11 rounds."],["4th","AD&D 2e","Polymorph Self","Alteration","4","0","2 turns/level","V","Assume many living forms while retaining Reylan's mind and hit points. The new form grants ordinary movement and physical capabilities, but not every magical or extraordinary power.","Reylan 7: 14 turns."],["4th","AD&D 2e","Stoneskin","Alteration","1","Touch","24 hours","V, S, M","Protect the subject from a limited number of physical attacks, each stopped attack consuming one layer of protection. Magical attacks and special effects may still apply according to their rules.","Reylan 7: stops 1d4+3 attacks."]];
      const COMMON_POTIONS=["Healing","Cure Light Wounds","Cure Serious Wounds","Invisibility","Clairaudience","Clairvoyance","Flying","Gaseous Form","Giant Strength","Heroism","Levitation","Speed","Sweet Water","Water Breathing"];
      const LIMITS={"1st":4,"2nd":3,"3rd":2,"4th":1};
      const ALL_LEVELED=Object.keys(LIMITS).flatMap(level=>SPELLS[level].map(name=>({level,name})));
      const DEFAULT={hp:28,wand:8,prepared:{"1st":[],"2nd":[],"3rd":[],"4th":[]},ring:[{name:"Magic Missile",used:false},{name:"Shield",used:false},{name:"Web",used:false}],potions:[{id:"potion-default-1",name:"Cure Light Wounds",used:false},{id:"potion-default-2",name:"Cure Serious Wounds",used:false},{id:"potion-default-3",name:"Giant Strength",used:false},{id:"potion-default-4",name:"Invisibility",used:false}],scrolls:{"Dimension Door":false,"Fly":false,"Protection from Normal Missiles":false},fieldNotes:""};
      const KEY="reylan-thorn-tracker-v1";
      let editorOpen=false;
      let preparedSerial=0;
      let potionSerial=0;
      const clone=value=>JSON.parse(JSON.stringify(value));
      const newPrepared=name=>({id:`prepared-${Date.now().toString(36)}-${preparedSerial++}`,name,cast:false});
      const normalizePotionName=name=>String(name||"").trim().replace(/^potion\s+of\s+/i,"").replace(/\s+/g," ");
      const newPotion=name=>({id:`potion-${Date.now().toString(36)}-${potionSerial++}`,name:normalizePotionName(name),used:false});
      const normalizePrepared=(prepared={},legacyCast={})=>Object.fromEntries(Object.keys(LIMITS).map(level=>[level,(prepared[level]||[]).slice(0,LIMITS[level]).map((entry,index)=>typeof entry==="string"?{id:`migrated-${level}-${index}-${entry.replace(/\W/g,"")}`,name:entry,cast:!!legacyCast[`${level}:${entry}`]}:{id:entry.id||`migrated-${level}-${index}`,name:entry.name,cast:!!entry.cast})]));
      const normalizePotions=potions=>Array.isArray(potions)?potions.map((entry,index)=>typeof entry==="string"?{id:`migrated-potion-${index}`,name:normalizePotionName(entry),used:false}:{id:entry.id||`migrated-potion-${index}`,name:normalizePotionName(entry.name),used:!!entry.used}).filter(entry=>entry.name):Object.entries(potions||{}).map(([name,used],index)=>({id:`migrated-potion-${index}`,name:normalizePotionName(name),used:!!used})).filter(entry=>entry.name);
      const hadSavedState=(()=>{try{return localStorage.getItem(KEY)!==null}catch{return false}})();
      const load=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY));return saved?{...clone(DEFAULT),...saved,prepared:normalizePrepared(saved.prepared,saved.cast),potions:normalizePotions(saved.potions??DEFAULT.potions),scrolls:{...DEFAULT.scrolls,...saved.scrolls}}:clone(DEFAULT)}catch{return clone(DEFAULT)}};
      let state=load();
      let saveLabel=hadSavedState?"Restored from this device":"Saves on this device";
      const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}};
      const esc=value=>String(value).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      const options=current=>'<option value="">Empty slot</option>'+ALL_LEVELED.map(s=>`<option value="${esc(s.name)}" ${s.name===current?"selected":""}>${s.level} — ${esc(s.name)}</option>`).join("");

      function preparedMarkup(){
        return Object.keys(LIMITS).map(level=>{
          const picked=state.prepared[level];
          const slots=picked.map(spell=>`<div class="spell-slot ${spell.cast?"cast":""}"><span>${esc(spell.name)}</span><button class="button small" data-cast-id="${esc(spell.id)}">${spell.cast?"Restore":"Cast"}</button></div>`).join("");
          const empties=Array.from({length:LIMITS[level]-picked.length},()=>'<div class="spell-slot empty">Unfilled slot</div>').join("");
          return `<section class="prepared-level"><div class="level-head"><h3>${level} level</h3><span>${picked.length} / ${LIMITS[level]} prepared</span></div><div class="prepared-list">${slots}${empties}</div></section>`;
        }).join("");
      }

      function spellbookMarkup(){
        return Object.keys(LIMITS).map(level=>{
          const full=state.prepared[level].length>=LIMITS[level];
          const choices=SPELLS[level].map(name=>{const count=state.prepared[level].filter(spell=>spell.name===name).length;return `<div class="spell-choice"><span>${esc(name)}</span><span class="quantity"><button class="qty-button" data-remove-prepared="${level}" data-spell-name="${esc(name)}" ${count===0?"disabled":""} aria-label="Remove one prepared ${esc(name)}">−</button><span class="spell-count">${count}</span><button class="qty-button" data-add-prepared="${level}" data-spell-name="${esc(name)}" ${full?"disabled":""} aria-label="Prepare another ${esc(name)}">+</button></span></div>`}).join("");
          return `<section class="spellbook-group"><h3>${level} level · choose ${LIMITS[level]}</h3>${choices}</section>`;
        }).join("");
      }

      function potionMarkup(){
        if(!state.potions.length)return '<p class="empty-message">No potions carried. Add one above when Reylan acquires it.</p>';
        return state.potions.map(potion=>`<div class="track-row potion-row ${potion.used?"used":""}"><span>Potion of ${esc(potion.name)}</span><button class="button small" data-potion-use="${esc(potion.id)}">${potion.used?"Restore":"Use"}</button><button class="button small danger remove-potion" data-potion-remove="${esc(potion.id)}" aria-label="Remove Potion of ${esc(potion.name)}">Remove</button></div>`).join("");
      }

      function detailedSpellbookMarkup(){
        return SPELL_DETAILS.map(([level,rules,name,school,cast,range,duration,components,effect,quick])=>{
          const search=esc([level,rules,name,school,effect,quick].join(" ").toLowerCase());
          return `<article class="spell-card" data-detail-spell data-level="${esc(level)}" data-spell-search="${search}"><h3>${esc(name)}</h3><div class="spell-tags"><span class="spell-tag">${esc(level)}</span><span class="spell-tag">${esc(rules)}</span><span class="spell-tag">${esc(school)}</span></div><dl class="spell-meta"><div><dt>Casting</dt><dd>${esc(cast)}</dd></div><div><dt>Range</dt><dd>${esc(range)}</dd></div><div><dt>Duration</dt><dd>${esc(duration)}</dd></div><div><dt>Components</dt><dd>${esc(components)}</dd></div></dl><p class="spell-effect">${esc(effect)}</p><p class="spell-quick"><strong>Reylan 7:</strong> ${esc(quick.replace(/^Reylan 7:\s*/i, ""))}</p></article>`;
        }).join("");
      }

      function filterDetailedSpellbook(){
        const query=document.getElementById("spell-search").value.trim().toLowerCase();
        const level=document.getElementById("spell-level-filter").value;
        let visible=0;
        document.querySelectorAll("[data-detail-spell]").forEach(card=>{const show=(!level||card.dataset.level===level)&&(!query||card.dataset.spellSearch.includes(query));card.hidden=!show;if(show)visible++});
        document.getElementById("no-spell-results").hidden=visible!==0;
      }

      function render(){
        const hpPct=Math.max(0,Math.min(100,state.hp/28*100));
        document.getElementById("app").innerHTML=`
          <main class="shell">
            <header class="hero"><div><p class="eyebrow">Magic User 7</p><h1>Reylan Thorn</h1><p class="tagline">Field ledger &amp; spell tracker</p></div><div class="seal" aria-hidden="true">RT</div></header>
            <nav class="top-actions" aria-label="Tracker actions"><span class="persist" role="status" aria-live="polite"><span class="persist-dot"></span>${saveLabel}</span><button class="button" id="sunrise-all">Sunrise: recharge wand</button><button class="button danger" id="reset">Reset tracker</button></nav>
            <section class="combat" aria-label="Combat overview">
              <article class="card hp-card"><p class="label">Hit points</p><div class="hp-line"><div><div class="hp-value"><strong>${state.hp}</strong><span>/ 28</span></div><div class="detail">${state.hp===0?"Down":state.hp<=7?"Critical":state.hp<=14?"Bloodied":"Standing"} · ${Math.round(hpPct)}%</div></div><div class="hp-actions"><button class="icon-button" data-hp="-1" aria-label="Lose one hit point">−</button><button class="icon-button" data-hp="1" aria-label="Recover one hit point">+</button></div></div><form class="hp-form" id="hp-form"><input id="hp-amount" type="number" min="1" value="1" aria-label="Hit point amount"><button class="button small" name="mode" value="damage">Damage</button><button class="button small" name="mode" value="heal">Heal</button></form></article>
              <article class="card stat-card"><p class="label">Armor class</p><strong class="big-stat">4</strong><span class="detail">Bracers AC 6 · Ring of Protection +1</span></article>
              <article class="card stat-card"><p class="label">THAC0</p><strong class="big-stat">18</strong><span class="detail">Quarterstaff · Dagger +1 backup</span></article>
            </section>
            <section class="dashboard">
              <div class="stack">
                <article class="panel"><div class="panel-head"><div><h2>Saving throws</h2><p>Ring of Protection +1 included</p></div></div><div class="save-grid">${[["Poison / Death",12],["Rod / Staff / Wand",8],["Petrification",10],["Breath Weapon",12],["Spell",9]].map(s=>`<div class="save"><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join("")}</div></article>
                <article class="panel"><div class="panel-head"><div><h2>Prepared spells</h2><p>Mark each spell as it is cast</p></div><div class="panel-actions"><button class="button small" id="open-spellbook">Detailed spellbook</button><button class="button small primary" id="toggle-editor">${editorOpen?"Done":"Choose spells"}</button></div></div><div><p class="label">At-will cantrips</p><div class="cantrips">${SPELLS.Cantrip.map(s=>`<span class="chip cantrip">${esc(s)}</span>`).join("")}</div>${preparedMarkup()}</div><section class="spellbook" ${editorOpen?"":"hidden"}><div class="spellbook-grid">${spellbookMarkup()}</div><p class="notice">Selections save automatically on this device. Detect Magic is the DM-approved, at-will conversion and is not also listed as a 1st-level spell.</p></section></article>
              </div>
              <div class="stack">
                <article class="panel"><div class="panel-head"><div><h2>Wand of Magic Missiles</h2><p>8 charges · regains all expended charges at sunrise</p></div><strong>${state.wand}/8</strong></div><div class="charges"><div class="charge-pips" aria-label="${state.wand} charges remaining">${Array.from({length:8},(_,i)=>`<button class="pip ${i<state.wand?"full":""}" data-wand-set="${i+1}" aria-label="Set wand to ${i+1} charges"></button>`).join("")}</div><div><button class="icon-button" data-wand="-1" aria-label="Use one wand charge">−</button> <button class="icon-button" data-wand="1" aria-label="Restore one wand charge">+</button></div></div><button class="button sunrise" id="sunrise-wand">Refresh at sunrise</button></article>
                <article class="panel"><div class="panel-head"><div><h2>Ring of Spell Storing</h2><p>Assign one spell to each of the three slots</p></div></div><div class="ring-slots">${state.ring.map((slot,i)=>`<div class="ring-slot ${slot.used?"expended":""}"><span class="ring-number">${i+1}</span><select data-ring="${i}" aria-label="Ring spell slot ${i+1}">${options(slot.name)}</select><button class="button small" data-ring-use="${i}">${slot.used?"Restore":"Expend"}</button></div>`).join("")}</div></article>
                <article class="panel"><div class="panel-head"><div><h2>Consumables</h2><p>Potions and scroll spells</p></div></div><p class="label">Potions</p><form class="potion-form" id="potion-form"><input id="potion-name" list="common-potions" autocomplete="off" placeholder="Choose a common potion or type any name" aria-label="Potion name"><datalist id="common-potions">${COMMON_POTIONS.map(name=>`<option value="${esc(name)}"></option>`).join("")}</datalist><button class="button small primary" type="submit">Add potion</button></form><div class="list">${potionMarkup()}</div><p class="label" style="margin-top:16px">Spell scroll</p><div class="list">${Object.entries(state.scrolls).map(([name,used])=>`<div class="track-row ${used?"used":""}"><span>${esc(name)}</span><button class="button small" data-scroll="${esc(name)}">${used?"Restore":"Cast"}</button></div>`).join("")}</div></article>
              </div>
            </section>
            <section class="panel field-notes"><div class="panel-head"><div><h2>Field Notes</h2><p>Status effects, durations, conditions, and temporary reminders · autosaves locally</p></div></div><textarea id="field-notes" aria-label="Field Notes" placeholder="Status effects, durations, conditions, reminders…">${esc(state.fieldNotes||"")}</textarea></section>
            <footer><span>Reylan Thorn · Neutral Good · Magic User 7</span><span>HP - ${state.hp} · AC 4 · THAC0 18</span></footer>
          </main>
          <dialog class="spell-dialog" id="spellbook-dialog" aria-labelledby="spellbook-title"><div class="dialog-shell"><header class="dialog-head"><div><h2 id="spellbook-title">Reylan's Detailed Spellbook</h2><p>Four DM-approved cantrips and 31 AD&amp;D 2e leveled spells · Level 7 quick reference</p></div><form method="dialog"><button class="button dialog-close">Close</button></form></header><div class="spell-tools"><input id="spell-search" type="search" placeholder="Search spell, school, or effect" aria-label="Search detailed spellbook"><select id="spell-level-filter" aria-label="Filter spellbook by level"><option value="">All levels</option><option value="Cantrip">Cantrips</option><option value="1st">1st level</option><option value="2nd">2nd level</option><option value="3rd">3rd level</option><option value="4th">4th level</option></select></div><div class="detail-spells">${detailedSpellbookMarkup()}<p class="no-spell-results" id="no-spell-results" hidden>No spells match that search.</p></div><p class="notice">Detect Magic is Reylan's DM-approved, at-will conversion. Leveled spells and caster-level calculations use AD&amp;D 2e.</p></div></dialog>`;
        wire();
      }

      function commit(){saveLabel=save()?"Saved on this device":"Local saving unavailable";render()}
      function wire(){
        document.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>{state.hp=Math.max(0,Math.min(28,state.hp+Number(b.dataset.hp)));commit()});
        document.getElementById("hp-form").onsubmit=e=>{e.preventDefault();const amount=Math.max(1,Number(document.getElementById("hp-amount").value)||1);const mode=e.submitter.value;state.hp=Math.max(0,Math.min(28,state.hp+(mode==="heal"?amount:-amount)));commit()};
        document.querySelectorAll("[data-wand]").forEach(b=>b.onclick=()=>{state.wand=Math.max(0,Math.min(8,state.wand+Number(b.dataset.wand)));commit()});
        document.querySelectorAll("[data-wand-set]").forEach(b=>b.onclick=()=>{state.wand=Number(b.dataset.wandSet);commit()});
        document.getElementById("sunrise-wand").onclick=()=>{state.wand=8;commit()};
        document.getElementById("sunrise-all").onclick=()=>{state.wand=8;commit()};
        const spellDialog=document.getElementById("spellbook-dialog");
        document.getElementById("open-spellbook").onclick=()=>spellDialog.showModal();
        spellDialog.onclick=e=>{if(e.target===spellDialog)spellDialog.close()};
        document.getElementById("spell-search").oninput=filterDetailedSpellbook;
        document.getElementById("spell-level-filter").onchange=filterDetailedSpellbook;
        document.getElementById("toggle-editor").onclick=()=>{editorOpen=!editorOpen;render();if(editorOpen)setTimeout(()=>document.querySelector(".spellbook").scrollIntoView({behavior:"smooth",block:"nearest"}),0)};
        document.querySelectorAll("[data-add-prepared]").forEach(b=>b.onclick=()=>{const level=b.dataset.addPrepared;if(state.prepared[level].length<LIMITS[level]){state.prepared[level].push(newPrepared(b.dataset.spellName));commit()}});
        document.querySelectorAll("[data-remove-prepared]").forEach(b=>b.onclick=()=>{const level=b.dataset.removePrepared,name=b.dataset.spellName,index=state.prepared[level].map(spell=>spell.name).lastIndexOf(name);if(index>=0){state.prepared[level].splice(index,1);commit()}});
        document.querySelectorAll("[data-cast-id]").forEach(b=>b.onclick=()=>{for(const level of Object.keys(LIMITS)){const spell=state.prepared[level].find(item=>item.id===b.dataset.castId);if(spell){spell.cast=!spell.cast;break}}commit()});
        document.querySelectorAll("[data-ring]").forEach(sel=>sel.onchange=()=>{state.ring[Number(sel.dataset.ring)].name=sel.value;state.ring[Number(sel.dataset.ring)].used=false;commit()});
        document.querySelectorAll("[data-ring-use]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.ringUse);if(state.ring[i].name){state.ring[i].used=!state.ring[i].used;commit()}});
        document.getElementById("potion-form").onsubmit=e=>{e.preventDefault();const input=document.getElementById("potion-name"),name=normalizePotionName(input.value);if(name){state.potions.push(newPotion(name));commit()}else input.focus()};
        document.querySelectorAll("[data-potion-use]").forEach(b=>b.onclick=()=>{const potion=state.potions.find(item=>item.id===b.dataset.potionUse);if(potion){potion.used=!potion.used;commit()}});
        document.querySelectorAll("[data-potion-remove]").forEach(b=>b.onclick=()=>{const index=state.potions.findIndex(item=>item.id===b.dataset.potionRemove);if(index>=0&&confirm(`Remove Potion of ${state.potions[index].name}?`)){state.potions.splice(index,1);commit()}});
        document.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>{const name=b.dataset.scroll;state.scrolls[name]=!state.scrolls[name];commit()});
        document.getElementById("field-notes").oninput=e=>{state.fieldNotes=e.target.value;saveLabel=save()?"Saved on this device":"Local saving unavailable";const status=document.querySelector(".persist");if(status&&status.lastChild)status.lastChild.textContent=saveLabel};
        document.getElementById("reset").onclick=()=>{if(confirm("Reset all tracked values to Reylan's starting state?")){state=clone(DEFAULT);editorOpen=false;commit()}};
      }
      render();
    })();
  </script>
</body>
</html>
